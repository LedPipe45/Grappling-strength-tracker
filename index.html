<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071329"><title>Grappling Strength Tracker</title><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Grappling Strength"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f8ff;background:#060d1d;--blue:#278dff;--gold:#ffcc47;--line:#25436b;--panel:#111e35;--muted:#a6b7d4}
*{box-sizing:border-box}html{background:#060d1d}body{margin:0;padding:0 0 100px;min-height:100vh;background:radial-gradient(ellipse 90% 420px at 50% 0%,#15366c 0%,transparent 75%),linear-gradient(180deg,#071329,#060d1d 60%);color:#f5f8ff}

header img{width:54px;height:54px;object-fit:cover;border-radius:13px;border:1px solid #f9c948;box-shadow:0 0 15px #208dff66}header h1{font-size:21px;letter-spacing:.25px;margin:0;font-weight:850;text-transform:uppercase;line-height:1.13}header small{display:block;margin-top:5px;letter-spacing:1.5px;text-transform:uppercase;color:#f2c755;font-size:10px;font-weight:800}
main{padding:18px 14px;max-width:680px;margin:auto}.card{position:relative;background:linear-gradient(145deg,rgba(22,41,73,.98),rgba(11,23,43,.99));border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 8px 22px #0005, inset 0 1px #ffffff0a;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:17px;right:17px;height:2px;background:linear-gradient(90deg,transparent,#2c94ff88,#ffce4880,transparent);pointer-events:none}.card:first-child{border-color:#396fbd;box-shadow:0 0 25px #156dff16,0 8px 24px #0007}
h2{font-size:20px;margin:0 0 14px;font-weight:850;letter-spacing:.15px}h3{font-size:16px;margin:8px 0;font-weight:800}p{line-height:1.5}small,.muted,.note{color:var(--muted)}.note{font-size:12px}.metric{font-size:35px;font-weight:900;color:var(--gold);text-shadow:0 0 18px #ffbd3140;letter-spacing:-1px}
.btn{background:linear-gradient(135deg,#65b8ff,#1c7cff);border:1px solid #74c7ff;color:#031327;font-size:16px;font-weight:850;border-radius:11px;padding:13px 16px;cursor:pointer;box-shadow:0 3px 0 #0a3d81,0 6px 20px #1578fc28;text-transform:uppercase;letter-spacing:.45px}.btn.alt{background:#21375b;border-color:#4169a5;color:#f3f7ff;box-shadow:none}.btn.warn{background:#302637;border-color:#8f5263;color:#ffb7b8;box-shadow:none}.btn:disabled{opacity:.4}button{cursor:pointer}.wide{width:100%}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row.wrap{flex-wrap:wrap}
input,select,textarea{background:#08152b;color:#fff;border:1px solid #43618d;border-radius:9px;padding:11px;font-size:16px;min-width:0;outline-color:#50b5ff}input[type=number]{width:88px}input[type=date]{width:166px}input[type=checkbox]{accent-color:#278dff}textarea{width:100%}label{font-size:13px;color:#c2d3ec}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(8,19,41,.97);border-top:1px solid #315a93;padding:10px 5px max(10px,env(safe-area-inset-bottom));z-index:3;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(16px)}nav button{flex:1;background:none;color:#a9b9d5;border:0;padding:8px 1px;font-size:12px}nav button{min-width:0}nav button.active{color:#ffce50;font-weight:850;text-shadow:0 0 12px #ffc64250}
.pill{border-radius:7px;padding:6px 10px;background:#183967;color:#ffcf58;font-size:12px;font-weight:800;border:1px solid #315c95;white-space:nowrap}.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 48px;gap:7px;align-items:center;margin:9px 0}.sets input{width:100%;padding:10px 8px}.sets button{background:#233f69;color:#fff;border:1px solid #436ca5;border-radius:9px;height:43px}.sets button.done{background:var(--gold);border-color:#ffe390;color:#111a2d;font-weight:900}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{background:#142948;border:1px solid #365681;color:#fff;border-radius:9px;min-height:55px;padding:6px 2px;font-size:13px}.day.selected{border:2px solid #57aaff;box-shadow:0 0 12px #218dff55}.day.completed{background:#58451a;border-color:#f6c348;color:#ffe28a}.day .tiny{display:block;font-size:10px;color:#b9d7ff}.day.completed .tiny{color:#ffde80}.tabs{display:flex;gap:6px;margin:10px 0 15px}.tabs button{flex:1}.empty{padding:20px;text-align:center;color:#b4c1d8}hr{border:0;border-top:1px solid #2b466c;margin:14px 0}
.card:has(.sets) h3{border-left:3px solid #319dff;padding-left:10px}.card:has(.metric) .metric{margin-top:16px}.card:has(.metric) .muted{font-size:13px}
.measure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.measure-grid label{display:block;margin-bottom:5px}.measure-grid input{width:100%}.powerbar{height:10px;border-radius:20px;background:#203353;overflow:hidden;margin:8px 0}.powerbar>span{display:block;height:100%;background:linear-gradient(90deg,#288cff,#ffcc47);border-radius:20px}.powerbig{font-size:38px;color:#ffcc47;font-weight:900;letter-spacing:-1px}.formname{color:#ffda6d;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase}.measure-row{padding:10px 0;border-bottom:1px solid #2a4266}.metric-sub{font-size:12px;color:#a8bcdb} @media(max-width:375px){nav button{font-size:10px;padding:7px 0}}@media(min-width:680px){header{justify-content:center}main{padding:24px}}
@media(prefers-reduced-motion:no-preference){.btn:active{transform:translateY(2px);box-shadow:none}nav button{transition:color .15s}}

/* Transformation-aware Saiyan themes. The selected form controls the full interface. */
:root{--aura:#278dff;--energy:#ffcc47;--glow:#278dff44;--sky:#15366c;--deep:#071329;--buttonText:#061529}
body{background:radial-gradient(ellipse 90% 430px at 50% 0%,var(--sky) 0%,transparent 77%),linear-gradient(180deg,var(--deep),#060d1d 70%);transition:background .35s ease}
header{border-bottom-color:var(--aura);box-shadow:0 5px 30px #0009,0 0 22px var(--glow)}
header img,.fighter-icon{border-color:var(--energy)!important;box-shadow:0 0 18px var(--glow)!important}
header small,.formname,.powerbig,.metric,nav button.active{color:var(--energy)!important}
.card{border-color:var(--line)}.card:before{background:linear-gradient(90deg,transparent,var(--aura),var(--energy),transparent)}
.card:first-child{border-color:var(--aura);box-shadow:0 0 25px var(--glow),0 8px 24px #0007}
.btn:not(.alt):not(.warn){background:linear-gradient(135deg,var(--energy),var(--aura));border-color:var(--energy);color:var(--buttonText);box-shadow:0 3px 0 #071429,0 6px 20px var(--glow)}
.btn.alt{border-color:var(--aura)}
.pill{color:var(--energy);border-color:var(--aura)}
nav{border-top-color:var(--aura)}nav button.active{text-shadow:0 0 14px var(--glow)}
.sets button.done{background:var(--energy);border-color:var(--energy)}
.day.selected{border-color:var(--aura);box-shadow:0 0 12px var(--glow)}
.day.completed{background:color-mix(in srgb,var(--energy) 23%,#121a2b);border-color:var(--energy);color:var(--energy)}
.card:has(.sets) h3{border-left-color:var(--aura)}
.powerbar>span{background:linear-gradient(90deg,var(--aura),var(--energy));box-shadow:0 0 16px var(--glow)}
input:focus,select:focus,textarea:focus{outline-color:var(--aura)}input[type=checkbox]{accent-color:var(--aura)}
.form-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.form-choice{min-height:64px;text-align:left;border:1px solid #3d5075;border-radius:11px;background:#0c1930;color:#dbe8ff;padding:11px;font-weight:750;font-size:12px}
.form-choice.active{border:2px solid var(--energy);box-shadow:0 0 17px var(--glow);color:var(--energy)}
.form-choice:disabled{opacity:.36}
.aura-orb{width:74px;height:74px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#ffffffb0,var(--energy) 22%,var(--aura) 54%,transparent 72%);box-shadow:0 0 20px var(--glow),0 0 42px var(--glow);position:relative}
body[data-form="ssj2"] .aura-orb,body[data-form="blue"] .aura-orb,body[data-form="ego"] .aura-orb{animation:auraPulse 2.2s ease-in-out infinite alternate}
@keyframes auraPulse{from{filter:brightness(.85);transform:scale(.95)}to{filter:brightness(1.2);transform:scale(1.05)}}
@media(prefers-reduced-motion:reduce){.aura-orb{animation:none!important}body{transition:none}}
</style></head><body><header><img src="icon.png" alt="Grappling Strength fighter icon"><div><h1>Grappling Strength</h1><small>TRAIN HARD · LEVEL UP · LB</small></div></header><main id="app"></main><nav id="nav"></nav>
<script>
const PROGRAM={
A:{title:"Explosive Strength",target:45,ex:[["Barbell back squat",3,"4–5","2–3 min","Strength; leave 2–3 reps in reserve"],["Vertical jumps",3,"3","60–90 sec","Jump high, land softly; stop if speed drops"],["Dumbbell bench press",3,"6–8","90 sec","Controlled reps"],["Barbell row",3,"6–8","90 sec","Strong brace"],["Farmer's holds",2,"30 sec","45–60 sec","Enter seconds in reps field"]]},
B:{title:"Hip Drive & Upper Power",target:45,ex:[["Explosive incline push-ups",3,"4–5","60 sec","Explode upward; controlled landing"],["Barbell Romanian deadlift",3,"5–6","2 min","Hinge; no bouncing"],["Standing overhead press",3,"6","90 sec","Brace core"],["One-arm dumbbell row",3,"8/side","60–90 sec","Record weight per dumbbell"],["Reverse lunges",2,"6/leg","60–90 sec","Record reps per leg"]]},
C:{title:"Saturday Heavy Full Body",target:75,ex:[["Vertical jumps",3,"3","60–90 sec","Explosive, not exhausting"],["Barbell back squat",3,"4–6","2–3 min","Heavy but controlled"],["Barbell bench press",3,"5–8","2 min","Leave 1–3 reps in reserve"],["Barbell Romanian deadlift",3,"6–8","2 min","Control eccentric"],["One-arm dumbbell row",3,"8/side","90 sec","Record weight per dumbbell"],["Farmer's holds",3,"30–45 sec","60 sec","Enter seconds in reps field"],["Plank",2,"45–60 sec","45 sec","Enter seconds in reps field"]]}
};
const KEY='grappling-strength-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{sessions:{},habits:{},weight:[]}}catch(e){db={sessions:{},habits:{},weight:[]}};
db.sessions ||= {};db.habits ||= {};db.weight ||= [];db.measurements ||= [];
let tab='today',selected=iso(new Date()),month=new Date().toISOString().slice(0,7);
function iso(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Storage unavailable. Export a backup and open this app in a browser that allows local storage.")}}
function type(date){let d=new Date(date+'T12:00:00'),n=d.getDay();return n===1?'A':n===3?'B':n===6?'C':null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.getElementById('nav').innerHTML=['today','calendar','progress','measurements','settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${{today:'⚡ Train',calendar:'📅 Calendar',progress:'⚡ Power',measurements:'📏 Body',settings:'⚙️ Backup'}[t]}</button>`).join('')}
function go(t){tab=t;render()}
function session(date){return db.sessions[date]}
function ensure(date,t){if(!db.sessions[date])db.sessions[date]={type:t,start:null,end:null,sets:{},notes:''};save();return db.sessions[date]}
function start(){let t=type(selected)||document.getElementById('manualType')?.value||'A',s=ensure(selected,t);s.start ||= Date.now();s.end=null;save();render()}
function finish(){let s=session(selected);if(!s)return;s.end=Date.now();save();render()}
function deleteWorkout(){let s=session(selected);if(!s)return;let label=fmtDate(selected);if(!confirm(`Delete the workout for ${label}?\n\nThis removes its sets, notes, and duration from your history and progress. Daily check-ins and body-weight records will remain. This cannot be undone.`))return;delete db.sessions[selected];save();render()}
function updateSet(name,i,field,val){let s=session(selected);if(!s)return;s.sets[name] ||= [];s.sets[name][i] ||= {weight:'',reps:'',done:false};s.sets[name][i][field]=val;save()}
function toggleSet(name,i){let s=session(selected);s.sets[name] ||= [];s.sets[name][i] ||= {weight:'',reps:'',done:false};s.sets[name][i].done=!s.sets[name][i].done;save();render()}
function previous(name,date){return Object.keys(db.sessions).filter(k=>k<date&&db.sessions[k].end&&db.sessions[k].sets[name]).sort().reverse().map(k=>({date:k,sets:db.sessions[k].sets[name]}))[0]}
function duration(s){if(!s?.start||!s.end)return null;return Math.round((s.end-s.start)/60000)}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}
function workout(){
let s=session(selected),t=s?.type||type(selected);
return `<div class="card"><div class="row"><h2>${esc(fmtDate(selected))}</h2><span class="pill">${t?'Workout '+t:'Rest day'}</span></div>
<label>Date</label> <input type="date" value="${selected}" onchange="selected=this.value;render()">
${!t?`<p class="muted">No lift scheduled. Grapple, recover, or start a makeup session.</p><select id="manualType"><option value="A">Workout A</option><option value="B">Workout B</option><option value="C">Workout C</option></select>`:''}
${!s?.start?`<p>Tap Start immediately before your warm-up. No running clock appears.</p><button class="btn wide" onclick="start()">▶ Start workout</button>`:s.end?`<p class="metric">${duration(s)} minutes</p><p class="muted">Target ${PROGRAM[s.type].target} min · ${duration(s)-PROGRAM[s.type].target>0?'+':''}${duration(s)-PROGRAM[s.type].target} min versus target</p><button class="btn alt wide" onclick="editTime()">Correct start / finish time</button>`:`<p class="pill">Session in progress · Started ${new Date(s.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</p><button class="btn warn wide" onclick="finish()">✓ Complete workout</button>`}</div>
${(s?.start?PROGRAM[s.type]:t?PROGRAM[t]:null)?exerciseCards(s?.start?PROGRAM[s.type]:PROGRAM[t],s):''}
${s?.start?`<div class="card"><label>Workout notes</label><textarea rows="2" placeholder="How did you feel? Grappling fatigue?" oninput="db.sessions[selected].notes=this.value;save()">${esc(s.notes)}</textarea></div>`:''}
 ${s?.start?`<div class="card"><h3>Manage workout</h3><p class="note">Delete this date’s workout and its exercise logs. Daily check-ins and body-weight entries are kept.</p><button class="btn warn wide" onclick="deleteWorkout()">🗑 Delete this workout</button></div>`:''}
${scouterMini()}<div class="card"><h3>Daily check-in</h3>${['Breakfast','Lunch','Grappling','Good sleep'].map(k=>`<label style="display:inline-flex;align-items:center;margin:8px 12px 8px 0;gap:5px"><input type="checkbox" ${db.habits[selected]?.[k]?'checked':''} onchange="habit('${k}',this.checked)">${k}</label>`).join('')}</div>`}
function exerciseCards(p,s){return p.ex.map(([name,count,reps,rest,note])=>{let prev=previous(name,selected);let prevText=prev?`Last (${prev.date}): ${prev.sets.filter(x=>x?.done).map(x=>`${x.weight||'BW'} × ${x.reps||'—'}`).join(', ')||'no completed sets'}`:'No previous session';let sets=s?.sets[name]||[];return `<div class="card"><div class="row"><h3>${esc(name)}</h3><span class="pill">${count} × ${reps}</span></div><p class="note">${esc(note)} · Rest ${rest}</p><p class="note">${esc(prevText)}</p>${s?.start?`<div class="sets"><label>Set</label><label>Weight (lb)</label><label>Reps/sec</label><label>Done</label></div>${Array.from({length:count},(_,i)=>{let x=sets[i]||{};return `<div class="sets"><span>${i+1}</span><input type="number" min="0" step="0.5" inputmode="decimal" value="${esc(x.weight)}" placeholder="BW" oninput="updateSet('${name}',${i},'weight',this.value)"><input type="number" min="0" step="1" inputmode="numeric" value="${esc(x.reps)}" placeholder="${esc(reps)}" oninput="updateSet('${name}',${i},'reps',this.value)"><button class="${x.done?'done':''}" onclick="toggleSet('${name}',${i})">${x.done?'✓':'○'}</button></div>`}).join('')}`:''}</div>`}).join('')}
function habit(k,v){db.habits[selected] ||= {};db.habits[selected][k]=v;save();render()}
function editTime(){let s=session(selected);let start=prompt('Start time (HH:MM, 24-hour)',new Date(s.start).toTimeString().slice(0,5));if(start===null)return;let end=prompt('Finish time (HH:MM, 24-hour)',new Date(s.end).toTimeString().slice(0,5));if(end===null)return;if(!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)){alert('Use HH:MM');return}let a=new Date(selected+'T'+start),b=new Date(selected+'T'+end);if(b<=a)b.setDate(b.getDate()+1);if((b-a)>6*3600000){alert('Duration exceeds 6 hours; no change saved');return}s.start=a.getTime();s.end=b.getTime();save();render()}
function calendar(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),cells=Array.from({length:first},()=>'<div></div>');for(let i=1;i<=days;i++){let date=`${month}-${String(i).padStart(2,'0')}`,t=type(date),s=session(date);cells.push(`<button class="day ${selected===date?'selected':''} ${s?.end?'completed':''}" onclick="selected='${date}';go('today')">${i}<span class="tiny">${s?.end?'✓ '+s.type:t||'·'}</span></button>`)}return `<div class="card"><div class="row"><button class="btn alt" onclick="changeMonth(-1)">‹</button><h2>${new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn alt" onclick="changeMonth(1)">›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<small style="text-align:center">${x}</small>`).join('')}${cells.join('')}</div><p class="note">A Monday · B Wednesday · C Saturday · Gold = completed. Tap a day to view or log it.</p></div><div class="card"><h3>Upcoming routine</h3><p>Monday: A · 45 min<br>Wednesday: B · 45 min<br>Saturday: C · 75 min</p><p class="note">Start Monday, November 9, 2026. This week: habit practice and drill weekend recovery.</p></div>`}
function changeMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=iso(d).slice(0,7);render()}
function progress(){let scouter=scouterFull();let completed=Object.entries(db.sessions).filter(([d,s])=>s.end).sort((a,b)=>b[0].localeCompare(a[0]));let all=[...new Set(Object.values(PROGRAM).flatMap(p=>p.ex.map(x=>x[0])))];return `${scouter}<div class="card"><h2>⚡ Training progress</h2><div class="row"><div><div class="metric">${completed.length}</div><small>Completed workouts</small></div><div><div class="metric">${completed.length?Math.round(completed.reduce((a,[d,s])=>a+duration(s),0)/completed.length):'—'}</div><small>Avg minutes</small></div></div></div><div class="card"><h3>⚡ Average session duration</h3>${['A','B','C'].map(t=>{let arr=completed.filter(([d,s])=>s.type===t);return `<p>Workout ${t}: <b>${arr.length?Math.round(arr.reduce((a,[d,s])=>a+duration(s),0)/arr.length)+' min':'No data'}</b> <small>(target ${PROGRAM[t].target} min)</small></p>`}).join('')}</div><div class="card"><h3>Exercise history</h3><select style="width:100%" id="exPick" onchange="exerciseHistory(this.value)">${all.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="exHistory"></div></div><div class="card"><h3>🏆 Recent workouts</h3>${completed.length?completed.slice(0,12).map(([d,s])=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #344451"><span>${d} · ${s.type}</span><b>${duration(s)} min</b></div>`).join(''):'<p class="muted">Your completed sessions will appear here.</p>'}</div><div class="card"><h3>Body weight</h3><div class="row"><input type="number" id="bodyWeight" step=".1" placeholder="183" inputmode="decimal"><button class="btn" onclick="addWeight()">Save weight</button></div><p class="note">Latest: ${db.weight.length?esc(db.weight[db.weight.length-1].value)+' lb':'Not recorded'} · Starting reference: 183 lb</p>${db.weight.slice(-8).reverse().map(x=>`<p class="note">${x.date}: ${x.value} lb</p>`).join('')}</div>`}
function exerciseHistory(name){let entries=Object.entries(db.sessions).filter(([d,s])=>s.end&&s.sets[name]).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('exHistory').innerHTML=entries.length?entries.slice(0,15).map(([d,s])=>{let sets=s.sets[name].filter(x=>x?.done);let max=Math.max(0,...sets.map(x=>Number(x.weight)||0));return `<p class="note"><b>${d}</b> · Max ${max} lb · ${sets.map(x=>`${x.weight||'BW'} × ${x.reps||'—'}`).join(' / ')}</p>`}).join(''):'<p class="muted">No completed sets logged yet.</p>'}
function addWeight(){let v=Number(document.getElementById('bodyWeight').value);if(!v||v<50||v>600)return alert('Enter a valid weight');db.weight.push({date:iso(new Date()),value:v});save();render()}
function settings(){return `<div class="card"><h2>Data and backup</h2><p>All workout records are stored in this browser on this device. They do not sync. Clearing browser data, using private browsing, or changing the app's website/origin can erase or separate your records.</p><button class="btn wide" onclick="backup()">⬇ Export JSON backup</button><p><label>Restore a previously exported backup</label></p><input type="file" accept=".json,application/json" onchange="restore(this.files[0])" style="width:100%"><hr><p class="note">Export a backup every week or two and save it in Files on your iPhone. This single HTML file works offline when opened in a browser that supports local storage; installing it as a Home Screen web app requires serving it over HTTPS.</p></div><div class="card"><h3>About your program</h3><p>Mon A · Wed B · Sat C. Track time from warm-up to final rep. The app does not run a visible timer. Start and finish timestamps are saved automatically.</p></div>`}
function backup(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='grappling-strength-backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data;if(!d||typeof d.sessions!=='object'||!Array.isArray(d.weight))throw Error('Invalid backup');if(confirm('Replace all current records with this backup?')){db=d;db.habits ||= {};db.measurements ||= [];save();render()}}catch(e){alert('Could not read backup: '+e.message)}};r.readAsText(f)}

// Saiyan scouter: permanent earned power, calculated from saved activity and records.
const MEASURES=[['waist','Waist'],['neck','Neck'],['hips','Hips'],['chest','Chest'],['shoulders','Shoulders'],['bicepsL','Left bicep'],['bicepsR','Right bicep'],['forearmL','Left forearm'],['forearmR','Right forearm'],['thighL','Left thigh'],['thighR','Right thigh'],['calfL','Left calf'],['calfR','Right calf']];
const HEIGHT_IN=69;
const FORMS=[['Base Vegeta',0,'#56a7ff'],['Super Saiyan',2500,'#ffcf48'],['Super Saiyan 2',4000,'#ffe378'],['Super Saiyan God',6500,'#ff617a'],['Super Saiyan Blue',10000,'#4dc8ff'],['Ultra Ego',16000,'#c589ff']];
const FORM_THEMES=[
 {id:'base',aura:'#278dff',energy:'#ffcc47',sky:'#15366c',deep:'#071329',line:'#25436b',text:'#061529'},
 {id:'ssj',aura:'#e6a925',energy:'#ffe077',sky:'#614619',deep:'#211a12',line:'#7e5c28',text:'#231906'},
 {id:'ssj2',aura:'#ffe15b',energy:'#fff3a6',sky:'#6b5018',deep:'#21190a',line:'#9b7935',text:'#241b06'},
 {id:'god',aura:'#ed4158',energy:'#ff9a79',sky:'#641d36',deep:'#220c1b',line:'#793448',text:'#27090e'},
 {id:'blue',aura:'#19aaff',energy:'#a4efff',sky:'#075482',deep:'#071e35',line:'#286d9b',text:'#031f35'},
 {id:'ego',aura:'#ab4bf2',energy:'#e5adff',sky:'#4d2079',deep:'#1b0e30',line:'#70419c',text:'#240d36'}
];
db.saiyan ||= {highestForm:0,chosenForm:null};
function unlockedFormIndex(power){let idx=0;FORMS.forEach((f,i)=>{if(power>=f[1])idx=i});return idx}
function syncUnlocks(power){let idx=unlockedFormIndex(power);if(idx>db.saiyan.highestForm){db.saiyan.highestForm=idx;save()}return db.saiyan.highestForm}
function activeFormIndex(power){let highest=syncUnlocks(power);let chosen=db.saiyan.chosenForm;return Number.isInteger(chosen)&&chosen>=0&&chosen<=highest?chosen:highest}
function selectForm(idx){let p=scouterData();let highest=syncUnlocks(p.total);if(idx<0||idx>highest)return;db.saiyan.chosenForm=idx;save();render()}
function autoForm(){db.saiyan.chosenForm=null;save();render()}
function applyFormTheme(){let p=scouterData();let i=activeFormIndex(p.total);let t=FORM_THEMES[i];document.body.dataset.form=t.id;let root=document.documentElement;for(let [key,val] of Object.entries({aura:t.aura,energy:t.energy,sky:t.sky,deep:t.deep,line:t.line,buttonText:t.text,glow:t.aura+'55'}))root.style.setProperty('--'+key,val);document.querySelector('meta[name="theme-color"]').setAttribute('content',t.deep)}
function formPicker(){let p=scouterData();let highest=syncUnlocks(p.total);let active=activeFormIndex(p.total);return `<div class="card"><h3>⚡ Choose your transformation</h3><p class="note">New forms unlock automatically as your power grows. Unlocked appearances remain available even if you later delete or correct a record.</p><div class="form-picker">${FORMS.map((f,i)=>`<button class="form-choice ${active===i?'active':''}" ${i>highest?'disabled':''} onclick="selectForm(${i})"><span style="color:${f[2]}">●</span> ${esc(f[0])}<div class="note">${i<=highest?'✓ Unlocked':f[1].toLocaleString()+' power'}</div></button>`).join('')}</div><button class="btn alt wide" onclick="autoForm()">Automatically use highest unlocked form</button><p class="note">Current appearance: ${esc(FORMS[active][0])}${db.saiyan.chosenForm===null?' · Automatic':''}</p></div>`}

function scouterData(){
 const completed=Object.entries(db.sessions).filter(([d,s])=>s?.end&&s?.start&&s.end>=s.start);
 const checked=Object.values(db.habits).filter(x=>x&&typeof x==='object');
 const grapple=checked.filter(x=>x.Grappling).length;
 const meals=checked.reduce((a,x)=>a+(x.Breakfast?1:0)+(x.Lunch?1:0),0);
 const sleep=checked.filter(x=>x['Good sleep']).length;
 const best={},first={};
 Object.entries(db.sessions).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,s])=>{
   if(!s?.end||!s?.sets)return;
   Object.entries(s.sets).forEach(([name,sets])=>{
     (Array.isArray(sets)?sets:[]).forEach(x=>{
       if(!x?.done)return;
       const w=Number(x.weight),r=Number(x.reps);
       if(!Number.isFinite(w)||!Number.isFinite(r)||w<=0||r<=0)return;
       const estimate=w*(1+Math.min(r,15)/30);
       if(first[name]===undefined)first[name]=estimate;
       best[name]=Math.max(best[name]||0,estimate);
     });
   });
 });
 const improvement=Object.keys(best).reduce((a,n)=>a+Math.min(250,Math.max(0,Math.round((best[n]/first[n]-1)*600))),0);
 const m=db.measurements||[];
 const measurementEntries=m.length;
 // Measurements reward consistent monitoring, not a particular body size or unsafe weight change.
 const strength=completed.length*85+improvement;
 const combat=grapple*65;
 const nutrition=meals*22;
 const recovery=sleep*38;
 const body=measurementEntries*55;
 const total=1000+strength+combat+nutrition+recovery+body;
 let form=FORMS[0];FORMS.forEach(f=>{if(total>=f[1])form=f});
 const next=FORMS.find(f=>f[1]>total);
 return {total,form,next,completed:completed.length,grapple,meals,sleep,measurementEntries,parts:[['Strength',strength],['Combat',combat],['Fuel',nutrition],['Recovery',recovery],['Body tracking',body]],improvement};
}
function scouterMini(){let p=scouterData();return `<div class="card"><div class="row"><div><div class="formname">⚡ Scouter · ${esc(p.form[0])}</div><div class="powerbig">${p.total.toLocaleString()}</div><small>Earned power · training + habits + measurements</small></div><div class="aura-orb" aria-hidden="true"></div></div>${p.next?`<div class="powerbar"><span style="width:${Math.min(100,100*p.total/p.next[1])}%"></span></div><div class="metric-sub">Next: ${esc(p.next[0])} · ${Math.max(0,p.next[1]-p.total).toLocaleString()} power to go</div>`:'<p class="metric-sub">ULTRA EGO UNLOCKED · Ultimate form</p>'}</div>`}
function scouterFull(){let p=scouterData();return `<div class="card"><div class="formname">CAPSULE CORP · SAIYAN SCOUTER</div><h2 style="margin-top:10px">${esc(p.form[0])}</h2><div class="row"><div><div class="powerbig">${p.total.toLocaleString()}</div><small>TOTAL POWER LEVEL</small></div><div class="aura-orb" aria-hidden="true"></div></div>${p.next?`<div class="powerbar"><span style="width:${Math.min(100,100*p.total/p.next[1])}%"></span></div><p class="note">Next transformation: <b>${esc(p.next[0])}</b> at ${p.next[1].toLocaleString()} power</p>`:'<p class="note">ULTRA EGO · Ultimate transformation achieved</p>'}<hr><h3>Power sources</h3>${p.parts.map(([name,v])=>`<div class="row measure-row"><span>${name}</span><b style="color:#ffce50">+${v.toLocaleString()}</b></div>`).join('')}<p class="note">Base power 1,000. Completed lifting workouts, grappling, meals, sleep, and body check-ins contribute once per saved record. Strength gains add a bonus when your best estimated lift improves. Unchecking or deleting a record adjusts its points. Transformations reflect your current saved power score.</p><p class="note">Power is a motivational score, not a medical or fitness assessment. Recovery and fueling matter; it does not reward restrictive eating, weight loss, or larger measurements.</p></div><div class="card"><h3>⚡ Transformations</h3>${FORMS.map((f,i)=>`<div class="row measure-row"><span style="color:${f[2]}">${esc(f[0])}</span><b>${i<=syncUnlocks(p.total)?'✓ Unlocked':f[1].toLocaleString()+' power'}</b></div>`).join('')}</div>${formPicker()}`}
function measurementValue(obj,key){return obj&&obj[key]!==undefined&&obj[key]!==null?Number(obj[key]):null}
function measurements(){
 const sorted=[...(db.measurements||[])].sort((a,b)=>b.date.localeCompare(a.date));const latest=sorted[0]||{};
 const wt=latest.weight??(db.weight.length?db.weight[db.weight.length-1].value:null);
 const waist=measurementValue(latest,'waist');const neck=measurementValue(latest,'neck');
 const bmi=wt&&wt>0?703*Number(wt)/(HEIGHT_IN*HEIGHT_IN):null;
 const whtr=waist!==null?waist/HEIGHT_IN:null;
 const navy=(wt&&waist&&neck&&waist>neck)?(86.010*Math.log10(waist-neck)-70.041*Math.log10(HEIGHT_IN)+36.76):null;
 return `<div class="card"><div class="formname">BODY COMPOSITION · TRAINING LOG</div><h2 style="margin-top:9px">📏 Measurements</h2><p class="note">Measure in inches, preferably under similar conditions. Record only what you want; empty fields stay empty. Your entries are stored locally.</p><label>Date</label><input type="date" id="measureDate" value="${iso(new Date())}" style="width:100%;margin:6px 0 12px"><div class="measure-grid"><div><label>Body weight (lb)</label><input id="m_weight" type="number" inputmode="decimal" step="0.1" min="1" placeholder="lb"></div>${MEASURES.map(([k,n])=>`<div><label>${esc(n)} (in)</label><input id="m_${k}" type="number" inputmode="decimal" step="0.1" min="0.1" placeholder="in"></div>`).join('')}</div><p class="note">Tip: For arms and thighs, measure relaxed at the same location each time. Use your waist at the same point each check-in.</p><button class="btn wide" onclick="saveMeasurements()">Save measurement check-in</button></div>
 <div class="card"><h3>Latest health indicators</h3><div class="row measure-row"><span>Body weight</span><b>${wt?esc(wt)+' lb':'—'}</b></div><div class="row measure-row"><span>BMI</span><b>${bmi?bmi.toFixed(1):'—'}</b></div><div class="row measure-row"><span>Waist-to-height ratio</span><b>${whtr?whtr.toFixed(3):'—'}</b></div><div class="row measure-row"><span>Estimated body fat (Navy)</span><b>${navy&&navy>0&&navy<70?navy.toFixed(1)+'%':'—'}</b></div><p class="note">Height reference: 5′9″ (69 in). BMI cannot distinguish muscle from fat. Waist-to-height ratio is a screening indicator, not a diagnosis. Navy body-fat estimates can be inaccurate, especially for muscular builds; track trends rather than treating the number as exact.</p></div>
 <div class="card"><h3>Measurement changes</h3>${measurementChanges(sorted)}</div><div class="card"><h3>Measurement history</h3>${sorted.length?sorted.map((m,i)=>`<div class="measure-row"><div class="row"><b>${esc(m.date)}</b><button class="btn alt" style="padding:7px 10px;font-size:12px" onclick="deleteMeasurements('${esc(m.date)}')">Delete</button></div><p class="note">${[['weight','Weight (lb)'],...MEASURES].filter(([k])=>m[k]!==undefined).map(([k,n])=>esc(n)+': '+esc(m[k])).join(' · ')}</p></div>`).join(''):'<p class="muted">No measurements yet. Your first check-in establishes your baseline.</p>'}</div>
 <div class="card"><h3>Body progress &amp; power</h3><p>Each saved measurement check-in contributes <b>+55 power</b> for tracking your health consistently. Changes in waist, arm, or thigh size are shown as trends but do not directly award points: measurements alone cannot distinguish muscle gain from fat gain or hydration changes.</p><p class="note">Aim for roughly one check-in every 1–2 weeks. A body measurement is not a strength test; actual lift improvements earn strength power.</p></div>`;
}
function measurementChanges(sorted){if(sorted.length<2)return '<p class="note">Add a second check-in to see trends.</p>';let rows=MEASURES.map(([k,n])=>{let vals=sorted.filter(x=>x[k]!==undefined);if(vals.length<2)return '';let diff=Number(vals[0][k])-Number(vals[vals.length-1][k]);return `<div class="row measure-row"><span>${esc(n)}</span><b>${diff>0?'+':''}${diff.toFixed(1)} in</b></div>`}).join('');return (rows||'<p class="note">No comparable entries yet.</p>')+'<p class="note">Changes compare earliest and latest values; bigger or smaller is not automatically better.</p>'}
function saveMeasurements(){const date=document.getElementById('measureDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return alert('Choose a valid date');let obj={date};for(let k of ['weight',...MEASURES.map(x=>x[0])]){let v=document.getElementById('m_'+k).value.trim();if(v==='')continue;let n=Number(v);if(!Number.isFinite(n)||n<=0||n>1000)return alert('Check '+k+'; enter a positive measurement');obj[k]=n}if(Object.keys(obj).length===1)return alert('Enter at least one measurement');db.measurements ||= [];let idx=db.measurements.findIndex(x=>x.date===date);if(idx>=0){if(!confirm('Replace the existing measurements for '+date+'?'))return;db.measurements[idx]=obj}else db.measurements.push(obj);save();render()}
function deleteMeasurements(date){if(!confirm('Delete the measurement check-in for '+date+'?'))return;db.measurements=db.measurements.filter(x=>x.date!==date);save();render()}

function render(){applyFormTheme();nav();document.getElementById('app').innerHTML=tab==='today'?workout():tab==='calendar'?calendar():tab==='progress'?progress():tab==='measurements'?measurements():settings();if(tab==='progress')exerciseHistory(document.getElementById('exPick').value)}
render();
</script></body></html>
