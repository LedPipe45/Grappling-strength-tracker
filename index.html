<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071329"><title>Grappling Strength Tracker</title><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Grappling Strength"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f8ff;background:#060d1d;--blue:#278dff;--gold:#ffcc47;--line:#25436b;--panel:#111e35;--muted:#a6b7d4}
*{box-sizing:border-box}html{background:#060d1d}body{margin:0;padding:0 0 100px;min-height:100vh;background:radial-gradient(ellipse 90% 420px at 50% 0%,#15366c 0%,transparent 75%),linear-gradient(180deg,#071329,#060d1d 60%);color:#f5f8ff}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:13px;padding:15px 18px;background:rgba(7,17,36,.96);border-bottom:1px solid #28528b;box-shadow:0 5px 30px #0009;backdrop-filter:blur(15px)}
header img{width:54px;height:54px;object-fit:cover;border-radius:13px;border:1px solid #f9c948;box-shadow:0 0 15px #208dff66}header h1{font-size:21px;letter-spacing:.25px;margin:0;font-weight:850;text-transform:uppercase;line-height:1.13}header small{display:block;margin-top:5px;letter-spacing:1.5px;text-transform:uppercase;color:#f2c755;font-size:10px;font-weight:800}
main{padding:18px 14px;max-width:680px;margin:auto}.card{position:relative;background:linear-gradient(145deg,rgba(22,41,73,.98),rgba(11,23,43,.99));border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:15px;box-shadow:0 8px 22px #0005, inset 0 1px #ffffff0a;overflow:hidden}.card:before{content:"";position:absolute;top:0;left:17px;right:17px;height:2px;background:linear-gradient(90deg,transparent,#2c94ff88,#ffce4880,transparent);pointer-events:none}.card:first-child{border-color:#396fbd;box-shadow:0 0 25px #156dff16,0 8px 24px #0007}
h2{font-size:20px;margin:0 0 14px;font-weight:850;letter-spacing:.15px}h3{font-size:16px;margin:8px 0;font-weight:800}p{line-height:1.5}small,.muted,.note{color:var(--muted)}.note{font-size:12px}.metric{font-size:35px;font-weight:900;color:var(--gold);text-shadow:0 0 18px #ffbd3140;letter-spacing:-1px}
.btn{background:linear-gradient(135deg,#65b8ff,#1c7cff);border:1px solid #74c7ff;color:#031327;font-size:16px;font-weight:850;border-radius:11px;padding:13px 16px;cursor:pointer;box-shadow:0 3px 0 #0a3d81,0 6px 20px #1578fc28;text-transform:uppercase;letter-spacing:.45px}.btn.alt{background:#21375b;border-color:#4169a5;color:#f3f7ff;box-shadow:none}.btn.warn{background:#302637;border-color:#8f5263;color:#ffb7b8;box-shadow:none}.btn:disabled{opacity:.4}button{cursor:pointer}.wide{width:100%}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row.wrap{flex-wrap:wrap}
input,select,textarea{background:#08152b;color:#fff;border:1px solid #43618d;border-radius:9px;padding:11px;font-size:16px;min-width:0;outline-color:#50b5ff}input[type=number]{width:88px}input[type=date]{width:166px}input[type=checkbox]{accent-color:#278dff}textarea{width:100%}label{font-size:13px;color:#c2d3ec}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(8,19,41,.97);border-top:1px solid #315a93;padding:10px 5px max(10px,env(safe-area-inset-bottom));z-index:3;box-shadow:0 -10px 30px #0008;backdrop-filter:blur(16px)}nav button{flex:1;background:none;color:#a9b9d5;border:0;padding:8px 1px;font-size:12px}nav button.active{color:#ffce50;font-weight:850;text-shadow:0 0 12px #ffc64250}
.pill{border-radius:7px;padding:6px 10px;background:#183967;color:#ffcf58;font-size:12px;font-weight:800;border:1px solid #315c95;white-space:nowrap}.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 48px;gap:7px;align-items:center;margin:9px 0}.sets input{width:100%;padding:10px 8px}.sets button{background:#233f69;color:#fff;border:1px solid #436ca5;border-radius:9px;height:43px}.sets button.done{background:var(--gold);border-color:#ffe390;color:#111a2d;font-weight:900}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.day{background:#142948;border:1px solid #365681;color:#fff;border-radius:9px;min-height:55px;padding:6px 2px;font-size:13px}.day.selected{border:2px solid #57aaff;box-shadow:0 0 12px #218dff55}.day.completed{background:#58451a;border-color:#f6c348;color:#ffe28a}.day .tiny{display:block;font-size:10px;color:#b9d7ff}.day.completed .tiny{color:#ffde80}.tabs{display:flex;gap:6px;margin:10px 0 15px}.tabs button{flex:1}.empty{padding:20px;text-align:center;color:#b4c1d8}hr{border:0;border-top:1px solid #2b466c;margin:14px 0}
.card:has(.sets) h3{border-left:3px solid #319dff;padding-left:10px}.card:has(.metric) .metric{margin-top:16px}.card:has(.metric) .muted{font-size:13px}
@media(min-width:680px){header{justify-content:center}main{padding:24px}}
@media(prefers-reduced-motion:no-preference){.btn:active{transform:translateY(2px);box-shadow:none}nav button{transition:color .15s}}
</style></head><body><header><img src="icon.png" alt="Grappling Strength fighter icon"><div><h1>Grappling Strength</h1><small>TRAIN HARD · LEVEL UP · LB</small></div></header><main id="app"></main><nav id="nav"></nav>
<script>
const PROGRAM={
A:{title:"Explosive Strength",target:45,ex:[["Barbell back squat",3,"4–5","2–3 min","Strength; leave 2–3 reps in reserve"],["Vertical jumps",3,"3","60–90 sec","Jump high, land softly; stop if speed drops"],["Dumbbell bench press",3,"6–8","90 sec","Controlled reps"],["Barbell row",3,"6–8","90 sec","Strong brace"],["Farmer's holds",2,"30 sec","45–60 sec","Enter seconds in reps field"]]},
B:{title:"Hip Drive & Upper Power",target:45,ex:[["Explosive incline push-ups",3,"4–5","60 sec","Explode upward; controlled landing"],["Barbell Romanian deadlift",3,"5–6","2 min","Hinge; no bouncing"],["Standing overhead press",3,"6","90 sec","Brace core"],["One-arm dumbbell row",3,"8/side","60–90 sec","Record weight per dumbbell"],["Reverse lunges",2,"6/leg","60–90 sec","Record reps per leg"]]},
C:{title:"Saturday Heavy Full Body",target:75,ex:[["Vertical jumps",3,"3","60–90 sec","Explosive, not exhausting"],["Barbell back squat",3,"4–6","2–3 min","Heavy but controlled"],["Barbell bench press",3,"5–8","2 min","Leave 1–3 reps in reserve"],["Barbell Romanian deadlift",3,"6–8","2 min","Control eccentric"],["One-arm dumbbell row",3,"8/side","90 sec","Record weight per dumbbell"],["Farmer's holds",3,"30–45 sec","60 sec","Enter seconds in reps field"],["Plank",2,"45–60 sec","45 sec","Enter seconds in reps field"]]}
};
const KEY='grappling-strength-v1';
let db;try{db=JSON.parse(localStorage.getItem(KEY))||{sessions:{},habits:{},weight:[]}}catch(e){db={sessions:{},habits:{},weight:[]}};
db.sessions ||= {};db.habits ||= {};db.weight ||= [];
let tab='today',selected=iso(new Date()),month=new Date().toISOString().slice(0,7);
function iso(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Storage unavailable. Export a backup and open this app in a browser that allows local storage.")}}
function type(date){let d=new Date(date+'T12:00:00'),n=d.getDay();return n===1?'A':n===3?'B':n===6?'C':null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.getElementById('nav').innerHTML=['today','calendar','progress','settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${{today:'⚡ Train',calendar:'📅 Calendar',progress:'🏆 Progress',settings:'⚙️ Backup'}[t]}</button>`).join('')}
function go(t){tab=t;render()}
function session(date){return db.sessions[date]}
function ensure(date,t){if(!db.sessions[date])db.sessions[date]={type:t,start:null,end:null,sets:{},notes:''};save();return db.sessions[date]}
function start(){let t=type(selected)||document.getElementById('manualType')?.value||'A',s=ensure(selected,t);s.start ||= Date.now();s.end=null;save();render()}
function finish(){let s=session(selected);if(!s)return;s.end=Date.now();save();render()}
function deleteWorkout(){let s=session(selected);if(!s)return;let label=fmtDate(selected);if(!confirm(`Delete the workout for ${label}?\n\nThis removes its sets, notes, and duration from your history and progress. Daily check-ins and body-weight records will remain. This cannot be undone.`))return;delete db.sessions[selected];save();render()}
function updateSet(name,i,field,val){let s=session(selected);if(!s)return;s.sets[name] ||= [];s.sets[name][i] ||= {weight:'',reps:'',done:false};s.sets[name][i][field]=val;save()}
function toggleSet(name,i){let s=session(selected);s.sets[name] ||= [];s.sets[name][i] ||= {weight:'',reps:'',done:false};s.sets[name][i].done=!s.sets[name][i].done;save();render()}
function previous(name,date){return Object.keys(db.sessions).filter(k=>k<date&&db.sessions[k].end&&db.sessions[k].sets[name]).sort().reverse().map(k=>({date:k,sets:db.sessions[k].sets[name]}))[0]}
function duration(s){if(!s?.start||!s.end)return null;return Math.round((s.end-s.start)/60000)}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}
function workout(){
let s=session(selected),t=s?.type||type(selected);
return `<div class="card"><div class="row"><h2>${esc(fmtDate(selected))}</h2><span class="pill">${t?'Workout '+t:'Rest day'}</span></div>
<label>Date</label> <input type="date" value="${selected}" onchange="selected=this.value;render()">
${!t?`<p class="muted">No lift scheduled. Grapple, recover, or start a makeup session.</p><select id="manualType"><option value="A">Workout A</option><option value="B">Workout B</option><option value="C">Workout C</option></select>`:''}
${!s?.start?`<p>Tap Start immediately before your warm-up. No running clock appears.</p><button class="btn wide" onclick="start()">▶ Start workout</button>`:s.end?`<p class="metric">${duration(s)} minutes</p><p class="muted">Target ${PROGRAM[s.type].target} min · ${duration(s)-PROGRAM[s.type].target>0?'+':''}${duration(s)-PROGRAM[s.type].target} min versus target</p><button class="btn alt wide" onclick="editTime()">Correct start / finish time</button>`:`<p class="pill">Session in progress · Started ${new Date(s.start).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</p><button class="btn warn wide" onclick="finish()">✓ Complete workout</button>`}</div>
${(s?.start?PROGRAM[s.type]:t?PROGRAM[t]:null)?exerciseCards(s?.start?PROGRAM[s.type]:PROGRAM[t],s):''}
${s?.start?`<div class="card"><label>Workout notes</label><textarea rows="2" placeholder="How did you feel? Grappling fatigue?" oninput="db.sessions[selected].notes=this.value;save()">${esc(s.notes)}</textarea></div>`:''}
 ${s?.start?`<div class="card"><h3>Manage workout</h3><p class="note">Delete this date’s workout and its exercise logs. Daily check-ins and body-weight entries are kept.</p><button class="btn warn wide" onclick="deleteWorkout()">🗑 Delete this workout</button></div>`:''}
<div class="card"><h3>Daily check-in</h3>${['Breakfast','Lunch','Grappling','Good sleep'].map(k=>`<label style="display:inline-flex;align-items:center;margin:8px 12px 8px 0;gap:5px"><input type="checkbox" ${db.habits[selected]?.[k]?'checked':''} onchange="habit('${k}',this.checked)">${k}</label>`).join('')}</div>`}
function exerciseCards(p,s){return p.ex.map(([name,count,reps,rest,note])=>{let prev=previous(name,selected);let prevText=prev?`Last (${prev.date}): ${prev.sets.filter(x=>x?.done).map(x=>`${x.weight||'BW'} × ${x.reps||'—'}`).join(', ')||'no completed sets'}`:'No previous session';let sets=s?.sets[name]||[];return `<div class="card"><div class="row"><h3>${esc(name)}</h3><span class="pill">${count} × ${reps}</span></div><p class="note">${esc(note)} · Rest ${rest}</p><p class="note">${esc(prevText)}</p>${s?.start?`<div class="sets"><label>Set</label><label>Weight (lb)</label><label>Reps/sec</label><label>Done</label></div>${Array.from({length:count},(_,i)=>{let x=sets[i]||{};return `<div class="sets"><span>${i+1}</span><input type="number" min="0" step="0.5" inputmode="decimal" value="${esc(x.weight)}" placeholder="BW" oninput="updateSet('${name}',${i},'weight',this.value)"><input type="number" min="0" step="1" inputmode="numeric" value="${esc(x.reps)}" placeholder="${esc(reps)}" oninput="updateSet('${name}',${i},'reps',this.value)"><button class="${x.done?'done':''}" onclick="toggleSet('${name}',${i})">${x.done?'✓':'○'}</button></div>`}).join('')}`:''}</div>`}).join('')}
function habit(k,v){db.habits[selected] ||= {};db.habits[selected][k]=v;save()}
function editTime(){let s=session(selected);let start=prompt('Start time (HH:MM, 24-hour)',new Date(s.start).toTimeString().slice(0,5));if(start===null)return;let end=prompt('Finish time (HH:MM, 24-hour)',new Date(s.end).toTimeString().slice(0,5));if(end===null)return;if(!/^\d\d:\d\d$/.test(start)||!/^\d\d:\d\d$/.test(end)){alert('Use HH:MM');return}let a=new Date(selected+'T'+start),b=new Date(selected+'T'+end);if(b<=a)b.setDate(b.getDate()+1);if((b-a)>6*3600000){alert('Duration exceeds 6 hours; no change saved');return}s.start=a.getTime();s.end=b.getTime();save();render()}
function calendar(){let [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),cells=Array.from({length:first},()=>'<div></div>');for(let i=1;i<=days;i++){let date=`${month}-${String(i).padStart(2,'0')}`,t=type(date),s=session(date);cells.push(`<button class="day ${selected===date?'selected':''} ${s?.end?'completed':''}" onclick="selected='${date}';go('today')">${i}<span class="tiny">${s?.end?'✓ '+s.type:t||'·'}</span></button>`)}return `<div class="card"><div class="row"><button class="btn alt" onclick="changeMonth(-1)">‹</button><h2>${new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn alt" onclick="changeMonth(1)">›</button></div><div class="calendar">${['S','M','T','W','T','F','S'].map(x=>`<small style="text-align:center">${x}</small>`).join('')}${cells.join('')}</div><p class="note">A Monday · B Wednesday · C Saturday · Gold = completed. Tap a day to view or log it.</p></div><div class="card"><h3>Upcoming routine</h3><p>Monday: A · 45 min<br>Wednesday: B · 45 min<br>Saturday: C · 75 min</p><p class="note">Start Monday, November 9, 2026. This week: habit practice and drill weekend recovery.</p></div>`}
function changeMonth(n){let [y,m]=month.split('-').map(Number),d=new Date(y,m-1+n,1);month=iso(d).slice(0,7);render()}
function progress(){let completed=Object.entries(db.sessions).filter(([d,s])=>s.end).sort((a,b)=>b[0].localeCompare(a[0]));let all=[...new Set(Object.values(PROGRAM).flatMap(p=>p.ex.map(x=>x[0])))];return `<div class="card"><h2>⚡ Training progress</h2><div class="row"><div><div class="metric">${completed.length}</div><small>Completed workouts</small></div><div><div class="metric">${completed.length?Math.round(completed.reduce((a,[d,s])=>a+duration(s),0)/completed.length):'—'}</div><small>Avg minutes</small></div></div></div><div class="card"><h3>⚡ Average session duration</h3>${['A','B','C'].map(t=>{let arr=completed.filter(([d,s])=>s.type===t);return `<p>Workout ${t}: <b>${arr.length?Math.round(arr.reduce((a,[d,s])=>a+duration(s),0)/arr.length)+' min':'No data'}</b> <small>(target ${PROGRAM[t].target} min)</small></p>`}).join('')}</div><div class="card"><h3>Exercise history</h3><select style="width:100%" id="exPick" onchange="exerciseHistory(this.value)">${all.map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="exHistory"></div></div><div class="card"><h3>🏆 Recent workouts</h3>${completed.length?completed.slice(0,12).map(([d,s])=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #344451"><span>${d} · ${s.type}</span><b>${duration(s)} min</b></div>`).join(''):'<p class="muted">Your completed sessions will appear here.</p>'}</div><div class="card"><h3>Body weight</h3><div class="row"><input type="number" id="bodyWeight" step=".1" placeholder="183" inputmode="decimal"><button class="btn" onclick="addWeight()">Save weight</button></div><p class="note">Latest: ${db.weight.length?esc(db.weight[db.weight.length-1].value)+' lb':'Not recorded'} · Starting reference: 183 lb</p>${db.weight.slice(-8).reverse().map(x=>`<p class="note">${x.date}: ${x.value} lb</p>`).join('')}</div>`}
function exerciseHistory(name){let entries=Object.entries(db.sessions).filter(([d,s])=>s.end&&s.sets[name]).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('exHistory').innerHTML=entries.length?entries.slice(0,15).map(([d,s])=>{let sets=s.sets[name].filter(x=>x?.done);let max=Math.max(0,...sets.map(x=>Number(x.weight)||0));return `<p class="note"><b>${d}</b> · Max ${max} lb · ${sets.map(x=>`${x.weight||'BW'} × ${x.reps||'—'}`).join(' / ')}</p>`}).join(''):'<p class="muted">No completed sets logged yet.</p>'}
function addWeight(){let v=Number(document.getElementById('bodyWeight').value);if(!v||v<50||v>600)return alert('Enter a valid weight');db.weight.push({date:iso(new Date()),value:v});save();render()}
function settings(){return `<div class="card"><h2>Data and backup</h2><p>All workout records are stored in this browser on this device. They do not sync. Clearing browser data, using private browsing, or changing the app's website/origin can erase or separate your records.</p><button class="btn wide" onclick="backup()">⬇ Export JSON backup</button><p><label>Restore a previously exported backup</label></p><input type="file" accept=".json,application/json" onchange="restore(this.files[0])" style="width:100%"><hr><p class="note">Export a backup every week or two and save it in Files on your iPhone. This single HTML file works offline when opened in a browser that supports local storage; installing it as a Home Screen web app requires serving it over HTTPS.</p></div><div class="card"><h3>About your program</h3><p>Mon A · Wed B · Sat C. Track time from warm-up to final rep. The app does not run a visible timer. Start and finish timestamps are saved automatically.</p></div>`}
function backup(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='grappling-strength-backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data;if(!d||typeof d.sessions!=='object'||!Array.isArray(d.weight))throw Error('Invalid backup');if(confirm('Replace all current records with this backup?')){db=d;db.habits ||= {};save();render()}}catch(e){alert('Could not read backup: '+e.message)}};r.readAsText(f)}
function render(){nav();document.getElementById('app').innerHTML=tab==='today'?workout():tab==='calendar'?calendar():tab==='progress'?progress():settings();if(tab==='progress')exerciseHistory(document.getElementById('exPick').value)}
render();
</script></body></html>
